<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
  </head>
  <body>
    <main>
      <h1>My Playlist</h1>
      <p>Songs from a chart, served by an API I deployed myself.</p>
      <input id="artist-input" type="text" placeholder="Enter an artist">
      <button id="song-button" type="button">Load the chart</button>
      <button id="back-button" type="button">Back</button>
      <button id="top-button" type="button">Top of the chart</button>
      <button id="artist-button" type="button">Only this artist</button>
      <button id="next-button" type="button">Next</button>	 
      <article>
      <h2 id="track-name">Press the button</h2>
      <p id="track-facts"></p>
      <p id="track-count"></p>	
    </article>	
    <button id="save-button" type="button">Save to my Top 5</button>    
    <h2>My Top 5</h2>
    <p id="favorites-list"></p>
    <p id="save-message"></p> 
  </main>
    <script src="script.js"></script>
  </body>
</html>
